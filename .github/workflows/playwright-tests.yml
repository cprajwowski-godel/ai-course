name: Playwright Tests

on:
  pull_request:
    branches: [ main ]

# Cancel any in-progress run for the same PR to save resources
concurrency:
  group: playwright-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  playwright-tests:
    name: playwright-tests
    runs-on: ubuntu-latest
    # Use the official Playwright image – browsers and system deps are pre-installed
    container: mcr.microsoft.com/playwright:v1.53.0-jammy
    timeout-minutes: 30

    env:
      CI: true

    # All "run" steps execute inside the project subfolder
    defaults:
      run:
        working-directory: ai-assisted-ci-cd

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install project dependencies using Yarn in CI mode (frozen lockfile)
      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache

      # Run all Playwright tests in parallel
      - name: Run Playwright tests
        run: yarn test

      # Always upload the HTML report so it is accessible after failures
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: ai-assisted-ci-cd/playwright-report
          retention-days: 30

      # Always upload traces for debugging failed tests
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: ai-assisted-ci-cd/test-results/**/trace*.zip
          retention-days: 30

      - name: Notify Teams on failure
        if: always()
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          notification-summary: "Playwright Tests Failed | PR: ${{ github.event.pull_request.title }} | Author: ${{ github.event.pull_request.user.login }} | Branch: ${{ github.head_ref }} | Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          notification-color: dc3545

      - name: Fetch previous history from gh-pages
        if: always() && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git show origin/gh-pages:history.json > /tmp/prev-history.json 2>/dev/null; then
            echo "Previous history found"
          else
            echo "[]" > /tmp/prev-history.json
          fi

      - name: Build history.json
        if: always() && github.ref == 'refs/heads/main'
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NEW_ENTRY=$(jq -n \
            --arg ts "$TIMESTAMP" \
            --arg run_url "$RUN_URL" \
            --arg sha "${{ github.sha }}" \
            --arg ref "${{ github.ref }}" \
            --arg conclusion "${{ job.status }}" \
            '{ timestamp: $ts, run_url: $run_url, sha: $sha, ref: $ref, conclusion: $conclusion }')
          jq --argjson entry "$NEW_ENTRY" '. + [$entry]' /tmp/prev-history.json > playwright-report/history.json

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-assisted-ci-cd/playwright-report

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ai-assisted-ci-cd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: ai-assisted-ci-cd/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache

      - name: Run yarn audit
        id: audit
        run: |
          yarn audit --level high --json > audit-report.json 2>&1 || true

      - name: Write audit summary
        if: always()
        run: |
          echo "## Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s audit-report.json ]; then
            HIGH=$(cat audit-report.json | grep '"type":"auditSummary"' | grep -o '"high":[0-9]*' | grep -o '[0-9]*' || echo "0")
            CRITICAL=$(cat audit-report.json | grep '"type":"auditSummary"' | grep -o '"critical":[0-9]*' | grep -o '[0-9]*' || echo "0")
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| High     | ${HIGH:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | ${CRITICAL:-0} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No vulnerabilities found at high or critical severity." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on high or critical vulnerabilities
        run: yarn audit --level high
